<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#141b23"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d4a5c"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1db954"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="url(#bg)" rx="14"/>

  <!-- title -->
  <text x="40" y="46" fill="#e8edf2" font-size="22" font-weight="700">Multimodal RAG — Architecture</text>
  <text x="40" y="70" fill="#7d8a99" font-size="13">Local MCP server · cloud-backed vectors · hybrid retrieval</text>

  <!-- ===== INGESTION PHASE (top band) ===== -->
  <text x="40" y="112" fill="#5a6b7d" font-size="11" font-weight="700" letter-spacing="1.5">INGESTION  (BATCH)</text>

  <!-- source types -->
  <g>
    <rect x="40" y="128" width="120" height="118" rx="9" fill="#1a232e" stroke="#2a3744"/>
    <text x="100" y="150" fill="#9fb0c0" font-size="11" text-anchor="middle" font-weight="600">SOURCES</text>
    <text x="56" y="174" fill="#c3d0dc" font-size="12">PDFs</text>
    <text x="56" y="194" fill="#c3d0dc" font-size="12">Images</text>
    <text x="56" y="214" fill="#c3d0dc" font-size="12">Code</text>
    <text x="56" y="234" fill="#c3d0dc" font-size="12">Notes · Links</text>
  </g>

  <!-- loaders -->
  <g>
    <rect x="210" y="128" width="160" height="118" rx="9" fill="#1a232e" stroke="#2a3744"/>
    <text x="290" y="150" fill="#9fb0c0" font-size="11" text-anchor="middle" font-weight="600">LOADERS</text>
    <text x="226" y="174" fill="#c3d0dc" font-size="11">PDF → page text</text>
    <text x="226" y="194" fill="#c3d0dc" font-size="11">image → VLM caption</text>
    <text x="226" y="214" fill="#c3d0dc" font-size="11">code → AST chunks</text>
    <text x="226" y="234" fill="#c3d0dc" font-size="11">prose → windowed</text>
  </g>

  <!-- embed -->
  <g>
    <rect x="420" y="128" width="150" height="118" rx="9" fill="#1a232e" stroke="#2a3744"/>
    <text x="495" y="150" fill="#9fb0c0" font-size="11" text-anchor="middle" font-weight="600">EMBED</text>
    <text x="495" y="182" fill="#c3d0dc" font-size="12" text-anchor="middle">Voyage</text>
    <text x="495" y="201" fill="#c3d0dc" font-size="12" text-anchor="middle">voyage-3.5</text>
    <text x="495" y="226" fill="#6f7e8d" font-size="10" text-anchor="middle">1024-dim vectors</text>
  </g>

  <!-- ingestion arrows -->
  <line x1="160" y1="187" x2="206" y2="187" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="187" x2="416" y2="187" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== DATABASE (center hub) ===== -->
  <g>
    <rect x="330" y="300" width="260" height="118" rx="11" fill="#152620" stroke="#1db954" stroke-width="1.6"/>
    <text x="460" y="326" fill="#1db954" font-size="12" text-anchor="middle" font-weight="700">SUPABASE · POSTGRES</text>
    <text x="460" y="352" fill="#d6e2dc" font-size="12" text-anchor="middle">rag_chunks table</text>
    <text x="460" y="376" fill="#9fc4ad" font-size="11" text-anchor="middle">pgvector (semantic)  +  tsvector (keyword)</text>
    <text x="460" y="398" fill="#6f8a78" font-size="10" text-anchor="middle">HNSW + GIN indexes · content-hash dedupe</text>
  </g>

  <!-- embed -> db -->
  <path d="M495 246 L495 282 Q495 300 478 300 L592 300" fill="none" stroke="#3d4a5c" stroke-width="1.6"/>
  <line x1="495" y1="246" x2="495" y2="298" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== RETRIEVAL PHASE (bottom band) ===== -->
  <text x="40" y="474" fill="#5a6b7d" font-size="11" font-weight="700" letter-spacing="1.5">RETRIEVAL  (RUNTIME)</text>

  <!-- claude -->
  <g>
    <rect x="40" y="300" width="150" height="118" rx="9" fill="#1a232e" stroke="#2a3744"/>
    <text x="115" y="326" fill="#9fb0c0" font-size="11" text-anchor="middle" font-weight="600">CLAUDE DESKTOP</text>
    <text x="115" y="356" fill="#c3d0dc" font-size="12" text-anchor="middle">MCP host</text>
    <text x="115" y="380" fill="#6f7e8d" font-size="10" text-anchor="middle">calls rag_search</text>
    <text x="115" y="398" fill="#6f7e8d" font-size="10" text-anchor="middle">during a chat</text>
  </g>

  <!-- mcp server -->
  <g>
    <rect x="210" y="300" width="90" height="118" rx="9" fill="#1a232e" stroke="#2a3744"/>
    <text x="255" y="326" fill="#9fb0c0" font-size="10.5" text-anchor="middle" font-weight="600">MCP</text>
    <text x="255" y="341" fill="#9fb0c0" font-size="10.5" text-anchor="middle" font-weight="600">SERVER</text>
    <text x="255" y="368" fill="#c3d0dc" font-size="10" text-anchor="middle">3 tools</text>
    <text x="255" y="386" fill="#6f7e8d" font-size="9" text-anchor="middle">hybrid</text>
    <text x="255" y="400" fill="#6f7e8d" font-size="9" text-anchor="middle">search</text>
  </g>

  <!-- claude <-> mcp <-> db (green path) -->
  <line x1="190" y1="359" x2="206" y2="359" stroke="#1db954" stroke-width="1.8" marker-end="url(#arrowG)" marker-start="url(#arrowG)"/>
  <line x1="300" y1="359" x2="326" y2="359" stroke="#1db954" stroke-width="1.8" marker-end="url(#arrowG)" marker-start="url(#arrowG)"/>

  <!-- retrieval detail -->
  <g>
    <rect x="620" y="300" width="260" height="118" rx="9" fill="#1a232e" stroke="#2a3744"/>
    <text x="750" y="326" fill="#9fb0c0" font-size="11" text-anchor="middle" font-weight="600">HYBRID SEARCH</text>
    <text x="636" y="352" fill="#c3d0dc" font-size="11">semantic (cosine / HNSW)</text>
    <text x="636" y="374" fill="#c3d0dc" font-size="11">keyword (Postgres FTS)</text>
    <text x="636" y="398" fill="#1db954" font-size="11">fused → Reciprocal Rank Fusion</text>
  </g>
  <line x1="590" y1="359" x2="616" y2="359" stroke="#3d4a5c" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- phase divider -->
  <line x1="40" y1="270" x2="880" y2="270" stroke="#222d38" stroke-width="1" stroke-dasharray="3 5"/>
</svg>
